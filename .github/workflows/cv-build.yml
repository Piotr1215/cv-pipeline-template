name: Build CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'data/**'                  # YAML data files
      - 'templates/**'             # LaTeX class files
      - 'scripts/**'               # Generator, application system, tests
      - 'Makefile'
      - 'requirements.txt'
      - '.claude/skills/**'
      - '.github/workflows/cv-build.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'applications/**'
      - 'Makefile'
      - 'requirements.txt'
      - '.claude/skills/**'
      - '.github/workflows/cv-build.yml'
  workflow_dispatch:               # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-debian:latest
    strategy:
      matrix:
        variant:
          - software-developer
          - devops-engineer
          - cloud-engineer
      fail-fast: false             # From Phase 1 feedback

    steps:
      - uses: actions/checkout@v4

      # Install Python and tools in container
      - name: Install Python and dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip poppler-utils
          pip3 install -r requirements.txt --break-system-packages

      # Generate .tex from YAML
      - name: Generate LaTeX from YAML
        run: |
          mkdir -p output/generated
          python3 scripts/generate.py \
            --variant ${{ matrix.variant }} \
            --data-dir data/ \
            --output output/generated/${{ matrix.variant }}.tex

      # Copy LaTeX class files to output directory
      - name: Copy LaTeX class files
        run: |
          cp templates/altacv-class/*.cls output/generated/
          cp templates/altacv-class/*.cfg output/generated/

      # Compile LaTeX (container has full TeXLive)
      - name: Compile LaTeX
        run: |
          cd output/generated
          pdflatex -interaction=nonstopmode -halt-on-error ${{ matrix.variant }}.tex

      # Run data completeness tests (for this variant only)
      - name: Test data completeness
        run: |
          python3 scripts/test_data_completeness.py --variant ${{ matrix.variant }}

      # Hermetic tests for the application outcome substrate (no PDFs needed)
      - name: Test application substrate
        run: |
          python3 scripts/test_phase5_substrate.py
          python3 -m unittest scripts.test_application_integrity scripts.test_optional_sections scripts.test_application_status

      - name: Build example application
        if: matrix.variant == 'devops-engineer'
        run: |
          if [ -f applications/example-acme-devops-engineer/application.yaml ]; then
            python3 -m scripts.application build example-acme-devops-engineer
          fi

      - name: Generate plain-text CV
        run: |
          python3 scripts/generate_ats.py --variant ${{ matrix.variant }} --data-dir data/ --output output/ats/${{ matrix.variant }}.txt

      # Upload both formats from the same variant build.
      - name: Upload CV files
        uses: actions/upload-artifact@v4
        with:
          name: cv-${{ matrix.variant }}
          path: |
            output/generated/${{ matrix.variant }}.pdf
            output/ats/${{ matrix.variant }}.txt
          retention-days: 90

  # NEW: Create GitHub Release with all CV PDFs
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: cv-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cv-${{ github.run_number }}
          name: CV Build ${{ github.run_number }}
          body: |
            Automated CV build from commit ${{ github.sha }}

            Generated PDF and plain-text CVs:
            - Software Developer CV
            - DevOps Engineer CV
            - Cloud Engineer CV
          files: |
            cv-artifacts/**/*.pdf
            cv-artifacts/**/*.txt
          draft: false
          prerelease: false
