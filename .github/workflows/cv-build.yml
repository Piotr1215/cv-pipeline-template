name: Build CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'applications/**'
      - 'Makefile'
      - 'requirements.txt'
      - '.claude/skills/**'
      - '.github/workflows/cv-build.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'applications/**'
      - 'Makefile'
      - 'requirements.txt'
      - '.claude/skills/**'
      - '.github/workflows/cv-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      texlive: ${{ steps.image.outputs.texlive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: image
        run: echo "texlive=$(make -s print-texlive-image)" >> "$GITHUB_OUTPUT"

  build:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.texlive }}
    strategy:
      matrix:
        variant: [software-developer, devops-engineer, cloud-engineer]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: make ci-setup
      - name: Build and test variant
        run: make ci-variant VARIANT=${{ matrix.variant }} PYTHON=.venv/bin/python
      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs-${{ matrix.variant }}
          path: output/**/*.log
          if-no-files-found: ignore
      - name: Upload CV files
        uses: actions/upload-artifact@v4
        with:
          name: cv-${{ matrix.variant }}
          path: |
            output/generated/${{ matrix.variant }}.pdf
            output/ats/${{ matrix.variant }}.txt
          retention-days: 90

  applications:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.texlive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: make ci-setup
      - name: Test application substrate
        run: make test-substrate PYTHON=.venv/bin/python
      - name: Build and validate all applications
        run: make ci-applications PYTHON=.venv/bin/python
      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs-applications
          path: output/**/*.log
          if-no-files-found: ignore

  release:
    needs: [build, applications]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: cv-rolling-release
      cancel-in-progress: false
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: cv-artifacts
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$COMMIT_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$COMMIT_SHA" > /dev/null
          fi
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title 'Latest CV build' --notes "Automated CV build from commit $COMMIT_SHA"
          fi
          gh release edit latest --title 'Latest CV build' --notes "Automated CV build from commit $COMMIT_SHA" --latest
          find cv-artifacts -type f \( -name '*.pdf' -o -name '*.txt' \) -exec gh release upload latest --clobber {} +
